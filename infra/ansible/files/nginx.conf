# Single entry point on :80 — static SPA plus a same-origin API path, so the browser
# never makes a cross-origin call and the frontend needs no absolute backend URL.

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;   # document uploads

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;   # client-side routing
    }

    # Equipment photos are static files in the backend image, served at the server
    # root rather than under /api — same upstream, same headers.
    location ~ ^/(api|equipment)/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
